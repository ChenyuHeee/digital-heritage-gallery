addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });

renderer.domElement.style.touchAction = 'none';
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  look.dragging = true;
  look.lastX = e.clientX;
  look.lastY = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (e.button !== 0) return;
  look.dragging = false;
});
renderer.domElement.addEventListener('pointercancel', () => { look.dragging = false; });
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!look.dragging) return;
  const dx = e.clientX - look.lastX;
  const dy = e.clientY - look.lastY;
  look.lastX = e.clientX;
  look.lastY = e.clientY;
  look.yaw -= dx * 0.005;
  look.pitch += dy * 0.004;
  look.pitch = THREE.MathUtils.clamp(look.pitch, -0.2, 0.4);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const World = new THREE.Group();
World.name = "World";
scene.add(World);

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  t += dt;

  const mx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  const mz = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
  if (mx !== 0 || mz !== 0) {
    const len = Math.hypot(mx, mz);
    const ix = mx / len;
    const iz = mz / len;
    const cosY = Math.cos(look.yaw);
    const sinY = Math.sin(look.yaw);
    const dx = ix * cosY + iz * sinY;
    const dz = -ix * sinY + iz * cosY;
    player.position.x += dx * PLAYER_SPEED * dt;
    player.position.z += dz * PLAYER_SPEED * dt;
    player.rotation.y = Math.atan2(dx, dz);
  }
  player.position.x = THREE.MathUtils.clamp(player.position.x, ROOF_BOUNDS.minX, ROOF_BOUNDS.maxX);
  player.position.z = THREE.MathUtils.clamp(player.position.z, ROOF_BOUNDS.minZ, ROOF_BOUNDS.maxZ);
  player.position.y = playerRestY + Math.sin(t * 4.2) * 0.035;
  playerArmL.rotation.x = Math.sin(t * 4.2) * 0.18;
  playerArmR.rotation.x = -Math.sin(t * 4.2) * 0.18;
  lantern.position.y = 2.55 + Math.sin(t * 1.6) * 0.04;
  water.position.y = 0.04 + Math.sin(t * 0.7) * 0.012;

  const cp = Math.cos(look.pitch);
  const sp = Math.sin(look.pitch);
  camera.position.set(
    player.position.x + Math.sin(look.yaw) * CAM_DIST * cp + 0.85,
    player.position.y + 0.16 + CAM_DIST * sp,
    player.position.z + Math.cos(look.yaw) * CAM_DIST * cp
  );
  if (camera.position.y < 0.42) camera.position.y = 0.42;
  camera.lookAt(player.position.x, player.position.y + CAM_LOOK_Y, player.position.z);

  renderer.render(scene, camera);
});
